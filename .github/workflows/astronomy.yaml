name: astronomy 

on:
  push:
    branches: [ main ]
    paths:
      - 'js/astronomy/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'js/astronomy/**'

  workflow_dispatch:

env:
  NODE_VERSION: '24'
  REGISTRY: https://registry.npmjs.org/
  HUSKY: 0

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.REGISTRY }}
          cache: 'npm'
          
      - name: install ephemerides dependencies
        run: npm -w js/ephemerides ci

      - name: build ephemerides
        run: npm -w js/ephemerides run build

      - name: install dependencies
        run: npm -w js/astronomy ci
        
      - name: test
        run: npm -w js/astronomy run test -- --run

      - name: compile
        run: npm -w js/astronomy run build
        
      - name: Semantic Release
        id: semantic
        if: github.event_name == 'push'
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        with:
          extra-plugins: |
            @semantic-release/git
          extends: |
            semantic-release-monorepo
          working_directory: js/astronomy
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}

      - name: Create Release
        uses: comnoco/create-release-action@7dea6dc82ac9d97ced7a764aa82811451bba80e0 # v2.0.5
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}
        with:
          tag_name: steps.semantic.outputs.new_release_git_tag
          release_name: steps.semantic.outputs.new_release_git_tag
          body: |
            ${{ steps.semantic.outputs.new_release_notes }}

      - name: publish
        if: steps.semantic.outputs.new_release_published == 'true'
        run: npm -w js/astronomy publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}
